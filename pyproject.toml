[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddleocr-service"
version = "0.1.0"
description = "Minimal PaddleOCR extraction service"
readme = "README.md"
requires-python = ">=3.7,<3.11"
dependencies = [
  "paddlepaddle==2.6.2",
  "paddleocr==2.7.3",
  "numpy>=1.19,<2.0",
  "opencv-python-headless",
  "pillow",
  "fastapi",
  "uvicorn[standard]",
  "gunicorn",
  "python-multipart",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

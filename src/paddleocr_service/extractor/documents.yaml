# ---------------------------------------------------------------------------
# Document Registry — per-country, per-document-type field label vocabulary
# ---------------------------------------------------------------------------
# Structure:
#   countries:
#     <ISO-3166-1-alpha3>:
#       name: <human readable>
#       languages: [<ISO-639-1 codes>]
#       documents:
#         <doc_type>:          # national_id | passport | drivers_license | residence_permit
#           classifier_keywords: [...]  # keywords that CONFIRM this doc type for this country
#           fields:
#             <field_name>: [label variant 1, label variant 2, ...]
#
# Field names must match DocumentFields attributes:
#   full_name, surname, given_names, id_number, date_of_birth, sex,
#   nationality, expiry_date, date_of_issue, place_of_birth,
#   district_of_birth, place_of_issue
#
# All label matching is case-insensitive and space/punctuation-normalised
# (via norm_text). Add new entries freely; the code picks the best match
# at runtime.
# ---------------------------------------------------------------------------

countries:

  # =========================================================================
  # KENYA
  # =========================================================================
